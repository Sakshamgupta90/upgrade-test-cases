name: CI

# Checks every case folder a push or pull request touches: dependencies install on the
# folder's own Python/Node version, then its tests run (or, without tests, a build,
# type check or compile check).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find changed projects
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.pick.outputs.python }}
      node: ${{ steps.pick.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: python3 .github/scripts/changed_projects.py
        env:
          BEFORE_SHA: ${{ github.event.before }}

  python:
    name: ${{ matrix.project }}
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "python=$(cat .python-version 2>/dev/null || echo 3.12)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.version.outputs.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install .; fi
          pip install pytest
      - name: Test
        run: |
          if find . -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            PYTHONPATH=. python -m pytest -q
          else
            echo "No tests in this project; checking every file compiles"
            python -m compileall -q .
          fi

  node:
    name: ${{ matrix.project }}
    needs: changes
    if: needs.changes.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          v=$(cat .nvmrc 2>/dev/null || cat .node-version 2>/dev/null || node -p "(require('./package.json').engines||{}).node||''" | grep -oE '[0-9]+' | head -1)
          echo "node=${v:-22}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.version.outputs.node }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: |
          has() { node -e "const s=require('./package.json').scripts||{}; process.exit(s['$1'] && !/no test specified/.test(s['$1']) ? 0 : 1)"; }
          if has test; then npm test
          elif has build; then echo "No tests; building"; npm run build
          elif [ -f tsconfig.json ]; then echo "No tests; type-checking"; npx tsc --noEmit -p .
          else echo "No tests; checking syntax"; find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -type f -print | xargs -r -n1 node --check
          fi

  result:
    name: CI
    needs: [changes, python, node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All changed projects passed
        run: |
          echo "python: ${{ needs.python.result }}  node: ${{ needs.node.result }}"
          for r in "${{ needs.changes.result }}" "${{ needs.python.result }}" "${{ needs.node.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
